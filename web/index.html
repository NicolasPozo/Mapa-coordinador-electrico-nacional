<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nodos del SEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Mapa a pantalla completa; los controles flotan encima.
   Agujas: una columna fina por subestación; altura = energía de la hora, color = costo marginal. */
:root {
  --bg: #EDF1EF; --surface: #F8FAF9; --ink: #17201E; --muted: #5A6A66; --line: #D2DBD7; --border: #A7B4B0;
  --accent: #A85A22; --p0: #1C7486; --p1: #DDAE3F; --p2: #B03F2B; --sinprecio: #8E9A96;
  --mar: #C5D5DA; --tierra: #E0E6E3; --tierra-cl: #FBFCFB;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1514; --surface: #151D1BEE; --ink: #E4EBE8; --muted: #91A29D; --line: #26322E; --border: #3D4C47;
    --accent: #DB8D52; --p0: #3AA3B6; --p1: #E7C25E; --p2: #E26A50; --sinprecio: #6B7874;
    --mar: #0B1110; --tierra: #1A2321; --tierra-cl: #22302C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1514; --surface: #151D1BEE; --ink: #E4EBE8; --muted: #91A29D; --line: #26322E; --border: #3D4C47;
  --accent: #DB8D52; --p0: #3AA3B6; --p1: #E7C25E; --p2: #E26A50; --sinprecio: #6B7874;
  --mar: #0B1110; --tierra: #1A2321; --tierra-cl: #22302C; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; overflow: hidden; }
[hidden] { display: none !important; }
#mapa { position: absolute; inset: 0; }

.caja { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px #0002; }
.panel {
  position: absolute; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left));
  width: min(380px, calc(100% - 24px)); padding: 14px; display: grid; gap: 10px; z-index: 2;
}
h1 { font-family: var(--font-display); font-weight: 700; font-size: 20px; margin: 0; line-height: 1.15; letter-spacing: -0.01em; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.sub a { color: var(--accent); }
.fila { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
select { font: 500 13px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; cursor: pointer; max-width: 100%; }
.modos { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.modos button { font: 500 12px var(--font-body); color: var(--muted); background: transparent; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.modos button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.etq { font-size: 12px; color: var(--muted); }
.modos button:disabled { opacity: 0.45; cursor: not-allowed; }
.nota { margin: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--accent); color: var(--ink); font-size: 12px; line-height: 1.4;
  background: color-mix(in srgb, var(--accent) 10%, transparent); }
.nota b { font-weight: 600; }
.nota .det { display: block; font: 11px var(--font-mono); color: var(--muted); margin-top: 2px; }
.atraso { color: var(--muted); }
.btn { font: 500 12px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; cursor: pointer; }
.btn:hover { border-color: var(--border); }
.btn.on { border-color: var(--accent); color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { border-top: 2px solid var(--line); padding-top: 4px; }
.kpi .k { font-size: 11px; color: var(--muted); }
.kpi .v { font: 500 17px var(--font-mono); }
.kpi .u { font-size: 11px; color: var(--muted); margin-left: 2px; }

.hora {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: max(28px, env(safe-area-inset-bottom));
  width: min(560px, calc(100% - 24px)); padding: 10px 12px; display: flex; gap: 10px; align-items: center; z-index: 2;
}
.hora input { flex: 1; accent-color: var(--accent); }
.hora output { font: 500 15px var(--font-mono); min-width: 48px; text-align: right; }

.leyenda { position: absolute; right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); padding: 10px 12px; display: grid; gap: 6px; font-size: 12px; color: var(--muted); z-index: 2; max-width: 220px; }
.leyenda .t { color: var(--ink); font-weight: 500; }
.rampa { height: 8px; width: 180px; border-radius: 4px; background: linear-gradient(90deg, var(--p0), var(--p1), var(--p2)); }
.ejes { display: flex; justify-content: space-between; font: 11px var(--font-mono); }
.ayuda { font-size: 11px; }

.tip { position: absolute; pointer-events: none; z-index: 3; padding: 8px 10px; font-size: 12px; min-width: 170px; }
.tip strong { display: block; font-size: 13px; }
.tip .k { color: var(--muted); }

.aviso { position: absolute; inset: 0; display: grid; place-items: center; z-index: 4; padding: 24px; background: color-mix(in srgb, var(--bg) 70%, transparent); }
.aviso > div { padding: 16px 18px; max-width: 440px; max-height: calc(100% - 16px); overflow: auto; text-align: center; }
.aviso strong { display: block; font: 700 16px var(--font-display); margin-bottom: 4px; }
.aviso p { margin: 0; color: var(--muted); }

.maplibregl-ctrl-attrib { font-size: 10px; }
@media (max-width: 700px) {
  .panel { padding: 10px 12px; gap: 8px; }
  h1 { font-size: 17px; }
  .panel .desliza { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .panel .desliza > * { flex: none; }
  .panel .desliza .modos { flex-wrap: nowrap; }
  .kpi .k { font-size: 10px; }
  .kpi .v { font-size: 14px; }
  .leyenda { top: auto; bottom: 84px; right: 12px; padding: 6px 8px; gap: 4px; }
  .leyenda .ayuda { display: none; }
  .rampa { width: 140px; }
  .hora { bottom: max(16px, env(safe-area-inset-bottom)); padding: 8px 10px; }
  .maplibregl-ctrl-bottom-right { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="mapa" role="application" aria-label="Mapa 3D de Chile con las subestaciones del SEN"></div>

<section class="panel caja" aria-label="Controles">
  <div>
    <h1>Nodos del SEN</h1>
    <p class="sub"><span id="sub">Cargando…</span></p>
  </div>
  <p class="nota" id="nota" hidden></p>
  <div class="fila">
    <select id="dia" aria-label="Día" disabled></select>
    <div class="modos" role="tablist" aria-label="Qué mostrar">
      <button role="tab" aria-selected="true" data-modo="demanda">Demanda real</button>
      <button role="tab" aria-selected="false" data-modo="pron">Pronóstico</button>
    </div>
    <button class="btn" id="mas-datos" hidden>Más datos</button>
  </div>
  <div class="fila desliza">
    <span class="etq">Mapa</span>
    <div class="modos" role="tablist" aria-label="Mapa base" id="fondos">
      <button role="tab" data-fondo="claro">Claro</button>
      <button role="tab" data-fondo="oscuro">Oscuro</button>
      <button role="tab" data-fondo="voyager">Calles</button>
      <button role="tab" data-fondo="satelite">Satélite</button>
      <button role="tab" data-fondo="minimo">Mínimo</button>
    </div>
  </div>
  <div class="fila desliza" role="group" aria-label="Volar a una zona">
    <button class="btn on" data-zona="todo">Todo</button>
    <button class="btn" data-zona="norte">Norte</button>
    <button class="btn" data-zona="centro">Centro</button>
    <button class="btn" data-zona="santiago">Santiago</button>
    <button class="btn" data-zona="sur">Sur</button>
  </div>
  <div class="kpis" aria-live="polite">
    <div class="kpi"><div class="k">Demanda del sistema</div><div><span class="v" id="k-dem">—</span><span class="u">MWh</span></div></div>
    <div class="kpi"><div class="k">Costo marginal</div><div><span class="v" id="k-cmg">—</span><span class="u">USD/MWh</span></div></div>
    <div class="kpi"><div class="k">Subestaciones</div><div><span class="v" id="k-n">—</span></div></div>
  </div>
</section>

<aside class="leyenda caja" id="leyenda"></aside>

<div class="hora caja">
  <button class="btn" id="play" aria-label="Reproducir las 24 horas">▶</button>
  <input type="range" id="hora" min="0" max="23" step="1" value="12" aria-label="Hora del día">
  <output id="hora-txt" for="hora">12:00</output>
</div>

<div class="tip caja" id="tip" hidden></div>
<div class="aviso" id="aviso" hidden><div class="caja"><strong id="aviso-t">Preparando datos</strong><p id="aviso-p"></p><div id="aviso-extra"></div></div></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.1.0/dist.min.js"></script>
<script src="ampliar.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const nf = (dec) => new Intl.NumberFormat('es-CL', { maximumFractionDigits: dec, minimumFractionDigits: dec });
  const fmt = (v, dec = 0) => v == null ? '—' : nf(dec).format(v);
  const reducir = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const oscuro = () => {
    const t = document.documentElement.dataset.theme;
    return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  };

  // ---------- mapas base ----------
  // CARTO (vectorial, sin clave), Esri World Imagery (satélite) y "mínimo": solo los contornos
  // de Natural Earth que sirve el propio servidor (/api/base), sin depender de terceros.
  const FONDOS = {
    claro: () => 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
    oscuro: () => 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    voyager: () => 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
    satelite: () => ({
      version: 8,
      sources: { sat: {
        type: 'raster', tileSize: 256, maxzoom: 19,
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        attribution: 'Imágenes © Esri, Maxar, Earthstar Geographics',
      } },
      layers: [{ id: 'sat', type: 'raster', source: 'sat', paint: { 'raster-saturation': -0.25, 'raster-brightness-max': 0.85 } }],
    }),
    minimo: () => ({
      version: 8,
      sources: { base: { type: 'geojson', data: new URL('api/base', location.href).href, attribution: 'Contornos: Natural Earth' } },
      layers: [
        { id: 'mar', type: 'background', paint: { 'background-color': css('--mar') } },
        { id: 'tierra', type: 'fill', source: 'base', paint: { 'fill-color': ['match', ['get', 'iso'], 'CHL', css('--tierra-cl'), css('--tierra')] } },
        { id: 'borde', type: 'line', source: 'base', paint: { 'line-color': css('--border'), 'line-width': 0.8 } },
      ],
    }),
  };
  let fondo = null;
  try { const f = localStorage.getItem('nodos3d.fondo'); if (f in FONDOS) fondo = f; } catch (e) {}
  const fondoActual = () => fondo || (oscuro() ? 'oscuro' : 'claro');   // sin elección: sigue el tema

  // Cámara inclinada mirando hacia el este, para que la cordillera quede de fondo.
  const CAMARA = { pitch: 55, bearing: 25 };
  const ZONAS = {
    todo: [[-76.0, -44.0], [-66.5, -17.5]],
    norte: [[-71.2, -27.5], [-67.0, -17.4]],
    centro: [[-72.6, -36.5], [-69.8, -27.5]],
    santiago: [[-71.2, -33.85], [-70.35, -33.2]],
    sur: [[-74.4, -43.6], [-71.0, -36.3]],
  };

  let DIAS = null, DATOS = null, modo = 'demanda', hora = 12, timer = null, sel = null;
  let pMax = 120, dMax = 1;

  // ---------- color ----------
  const hex = (h) => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
  const mezcla = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  let RAMPA, SINPRECIO, ACENTO;
  function paleta() { RAMPA = ['--p0', '--p1', '--p2'].map(v => hex(css(v))); SINPRECIO = hex(css('--sinprecio')); ACENTO = hex(css('--accent')); }
  function colorPrecio(p) {
    if (p == null) return SINPRECIO;
    const t = Math.max(0, Math.min(1, p / pMax));
    return t < 0.45 ? mezcla(RAMPA[0], RAMPA[1], t / 0.45) : mezcla(RAMPA[1], RAMPA[2], (t - 0.45) / 0.55);
  }

  // ---------- mapa ----------
  const map = new maplibregl.Map({
    container: 'mapa', style: FONDOS[fondoActual()](),
    center: [-70.8, -33.0], zoom: 4.6, ...CAMARA,
    maxPitch: 75, attributionControl: { compact: true },
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');
  const overlay = new deck.MapboxOverlay({ interleaved: true, layers: [] });
  map.addControl(overlay);

  function marcarFondo() {
    document.querySelectorAll('[data-fondo]').forEach(b => b.setAttribute('aria-selected', b.dataset.fondo === fondoActual()));
  }
  function ponerFondo(f) {
    fondo = f;
    try { localStorage.setItem('nodos3d.fondo', f); } catch (e) {}
    map.setStyle(FONDOS[f]());
    marcarFondo();
  }
  document.querySelectorAll('[data-fondo]').forEach(b => b.addEventListener('click', () => ponerFondo(b.dataset.fondo)));
  marcarFondo();

  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    // Cambia el mapa si sigue al tema, o si es el mínimo (sus colores salen del tema).
    if (!fondo || fondo === 'minimo') map.setStyle(FONDOS[fondoActual()]());
    marcarFondo(); paleta(); dibujar(); leyenda();
  });

  function irA(nombre, animar = true) {
    const ancho = innerWidth > 700;
    const panel = document.querySelector('.panel').getBoundingClientRect();
    const padding = ancho
      ? { top: 60, bottom: 90, left: 400, right: 20 }
      : { top: Math.min(innerHeight * 0.4, panel.bottom + 10), bottom: 80, left: 20, right: 20 };
    map.fitBounds(ZONAS[nombre], { ...CAMARA, padding, duration: animar && !reducir() ? 2200 : 0, essential: true });
    document.querySelectorAll('[data-zona]').forEach(b => b.classList.toggle('on', b.dataset.zona === nombre));
  }
  document.querySelectorAll('[data-zona]').forEach(b => b.addEventListener('click', () => irA(b.dataset.zona)));

  // Grosor y altura se adaptan al zoom: a escala país las agujas deben verse, en Santiago no deben taparse.
  const tamano = () => {
    const z = map.getZoom();
    return {
      radio: Math.max(250, Math.min(9000, 2200 * Math.pow(2, 7 - z) ** 0.85)) * 0.3,
      alturaMax: Math.max(4000, 380000 * Math.pow(2, 4.6 - z) ** 0.8) * 1.7,
    };
  };
  map.on('zoom', () => dibujar());

  // ---------- capas ----------
  const serie = (n) => modo === 'pron' ? n.f : n.d;
  const val = (n) => serie(n)?.[hora];
  const colorDe = (n) => {
    const c = modo === 'pron' ? ACENTO : colorPrecio(n.p?.[hora]);
    return [...c, sel && sel !== n.id ? 90 : 255];
  };
  const transicion = (props) => reducir() ? {} : Object.fromEntries(props.map(p => [p, { duration: 450 }]));

  function dibujar() {
    if (!DATOS || !RAMPA) return;
    const { radio, alturaMax } = tamano();
    const disparo = [hora, modo, sel, pMax, RAMPA];
    const datos = DATOS.nodos.filter(n => (val(n) ?? 0) > 0);
    const comunes = {
      data: datos, pickable: true, onHover: mostrarTip,
      getPosition: n => [n.lo, n.la],
      onClick: ({ object }) => { sel = object && sel !== object.id ? object.id : null; if (object && sel) volarA(object); dibujar(); },
    };
    $('k-n').textContent = fmt(datos.length);
    overlay.setProps({
      layers: [
        new deck.ScatterplotLayer({
          ...comunes, id: 'bases', radiusUnits: 'pixels', getRadius: 3, stroked: false,
          getFillColor: colorDe, updateTriggers: { getFillColor: disparo },
        }),
        new deck.ColumnLayer({
          ...comunes, id: 'agujas', diskResolution: 8, radius: radio, extruded: true,
          elevationScale: alturaMax / dMax, getElevation: n => Math.max(0, val(n) ?? 0), getFillColor: colorDe,
          material: { ambient: 0.85, diffuse: 0.35, shininess: 8, specularColor: [30, 30, 30] },
          updateTriggers: { getElevation: disparo, getFillColor: disparo },
          transitions: transicion(['getElevation', 'getFillColor']),
        }),
      ],
    });
  }
  function volarA(n) {
    map.flyTo({ center: [n.lo, n.la], zoom: Math.max(map.getZoom(), 9), ...CAMARA, duration: reducir() ? 0 : 1800, essential: true });
  }
  map.on('click', (e) => { if (!overlay.pickObject({ x: e.point.x, y: e.point.y })) { sel = null; dibujar(); } });

  function mostrarTip({ object, x, y }) {
    const tip = $('tip');
    if (!object) { tip.hidden = true; return; }
    const n = object, h = String(hora).padStart(2, '0') + ':00';
    tip.innerHTML = `<strong></strong><div class="k"></div>` + (modo === 'pron'
      ? `<div>Pronóstico ${h}: <b>${fmt(n.f?.[hora], 1)}</b> MWh</div>`
      : `<div>Demanda ${h}: <b>${fmt(n.d?.[hora], 1)}</b> MWh</div><div>Costo marginal: <b>${fmt(n.p?.[hora], 1)}</b> USD/MWh</div>`);
    tip.querySelector('strong').textContent = n.n;
    tip.querySelector('.k').textContent = [n.c, n.r].filter(Boolean).join(' · ');
    tip.hidden = false;
    const w = tip.offsetWidth, hh = tip.offsetHeight;
    tip.style.left = Math.min(innerWidth - w - 8, x + 14) + 'px';
    tip.style.top = Math.max(8, Math.min(innerHeight - hh - 8, y + 14)) + 'px';
  }

  // ---------- leyenda, KPIs, hora ----------
  function leyenda() {
    const L = $('leyenda');
    if (modo === 'pron') {
      L.innerHTML = `<div class="t">Pronóstico de demanda</div><div class="ayuda">Altura: energía pronosticada de la hora por subestación (MWh).</div>`;
    } else {
      L.innerHTML = `<div class="t">Costo marginal (USD/MWh)</div><div class="rampa"></div>
        <div class="ejes"><span>0</span><span>${fmt(pMax * 0.45)}</span><span>${fmt(pMax)}+</span></div>
        <div class="ayuda">Altura: demanda de la hora por subestación (MWh). Gris: sin precio ese día.</div>`;
    }
    L.insertAdjacentHTML('beforeend', `<div class="ayuda">Arrastra con clic derecho (o dos dedos) para girar e inclinar.</div>`);
  }
  function kpis() {
    const s = DATOS?.sistema || {};
    $('k-dem').textContent = fmt(modo === 'pron' ? s.f?.[hora] : s.d?.[hora]);
    $('k-cmg').textContent = modo === 'pron' ? '—' : fmt(s.p?.[hora], 1);
  }
  function ponerHora(h) {
    hora = h; $('hora').value = h; $('hora-txt').textContent = String(h).padStart(2, '0') + ':00';
    kpis(); dibujar();
  }
  $('hora').addEventListener('input', (e) => { parar(); ponerHora(+e.target.value); });
  function parar() { clearInterval(timer); timer = null; $('play').textContent = '▶'; $('play').setAttribute('aria-label', 'Reproducir las 24 horas'); }
  $('play').addEventListener('click', () => {
    if (timer) return parar();
    $('play').textContent = '❚❚'; $('play').setAttribute('aria-label', 'Pausar');
    timer = setInterval(() => ponerHora((hora + 1) % 24), 900);
  });

  // ---------- datos ----------
  async function json(url) {
    const r = await fetch(url, { cache: 'no-cache' });
    if (!r.ok) { const e = new Error(r.status === 503 ? 'sin-datos' : 'HTTP ' + r.status); e.status = r.status; throw e; }
    return r.json();
  }
  function aviso(t, p) { $('aviso').hidden = !t; $('aviso-extra').innerHTML = ''; if (t) { $('aviso-t').textContent = t; $('aviso-p').textContent = p || ''; } }

  function llenarDias() {
    const s = $('dia');
    const lista = modo === 'pron' ? DIAS.pronostico.map(d => ({ dia: d })) : DIAS.demanda;
    s.innerHTML = '';
    for (const d of lista.slice().reverse()) {
      const o = document.createElement('option');
      o.value = d.dia;
      o.textContent = new Date(d.dia + 'T12:00').toLocaleDateString('es-CL', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) + (d.con_precio === false ? ' (sin precio)' : '');
      s.appendChild(o);
    }
    // Pronóstico: hoy si está; demanda: el último día con precio.
    const hoy = new Date().toLocaleDateString('sv-SE');
    const preferido = modo === 'pron'
      ? (DIAS.pronostico.includes(hoy) ? hoy : null)
      : DIAS.demanda.filter(d => d.con_precio).at(-1)?.dia;
    if (preferido) s.value = preferido;
    s.disabled = !lista.length;
  }

  async function cargarDia() {
    const dia = $('dia').value;
    if (!dia) return;
    aviso('Cargando', dia);
    try {
      DATOS = await json(modo === 'pron' ? `api/pronostico?dia=${dia}` : `api/mapa?dia=${dia}`);
      const precios = DATOS.nodos.flatMap(n => n.p || []).filter(v => v != null).sort((a, b) => a - b);
      pMax = Math.max(60, precios[Math.floor(precios.length * 0.97)] || 120);
      dMax = Math.max(1, ...DATOS.nodos.flatMap(n => serie(n) || []).filter(v => v != null));
      $('sub').textContent = (modo === 'pron' ? 'Pronóstico CEN · ' : 'Demanda real CEN · ') +
        new Date(dia + 'T12:00').toLocaleDateString('es-CL', { day: 'numeric', month: 'long', year: 'numeric' });
      $('sub').insertAdjacentHTML('beforeend', ` <span class="atraso">· ${atraso(dia)}</span>`);
      sel = null; aviso(null); leyenda(); kpis(); dibujar();
    } catch (e) {
      aviso('No pude cargar ese día', e.message);
    }
  }
  $('dia').addEventListener('change', cargarDia);
  // «hace 55 días», «hoy», «mañana»: la demanda real llega con ~2 meses de atraso y conviene decirlo.
  function atraso(dia) {
    const hoy = new Date(); hoy.setHours(12, 0, 0, 0);
    const d = Math.round((hoy - new Date(dia + 'T12:00')) / 864e5);
    if (d === 0) return 'hoy';
    if (d === 1) return 'ayer';
    if (d === -1) return 'mañana';
    return d > 0 ? `hace ${d} días` : `en ${-d} días`;
  }

  function ponerModo(m) {
    modo = m;
    document.querySelectorAll('[data-modo]').forEach(x => x.setAttribute('aria-selected', x.dataset.modo === m));
  }
  document.querySelectorAll('[data-modo]').forEach(b => b.addEventListener('click', () => {
    if (modo === b.dataset.modo || b.disabled) return;
    ponerModo(b.dataset.modo);
    llenarDias(); cargarDia();
  }));

  // Vista rápida del primer arranque: el servidor publica primero solo el pronóstico (~1 min)
  // y después la demanda real con precios. Mientras tanto se muestra el pronóstico con un aviso.
  let vistaRapida = false;
  function revisarVistaRapida() {
    const sinDemanda = !DIAS.demanda.length;
    const tab = document.querySelector('[data-modo=demanda]');
    tab.disabled = sinDemanda;
    tab.title = sinDemanda ? 'La demanda real todavía se está descargando' : '';
    if (sinDemanda && !vistaRapida) { vistaRapida = true; ponerModo('pron'); }
    if (!sinDemanda && vistaRapida) { vistaRapida = false; ponerModo('demanda'); }
    if (!vistaRapida) $('nota').hidden = true;
  }
  function pintarNota(e) {
    if (!vistaRapida) return;
    const min = e?.transcurrido_s != null ? Math.floor(e.transcurrido_s / 60) : null;
    $('nota').hidden = false;
    $('nota').innerHTML = '<b>Vista rápida:</b> pronóstico del CEN para hoy y mañana. La demanda real y los precios se están descargando y el mapa cambiará solo al terminar.<span class="det"></span>';
    $('nota').querySelector('.det').textContent = e?.en_curso
      ? [e.pasos_total ? `Paso ${e.paso_n} de ${e.pasos_total}` : null, e.paso, e.detalle, min != null ? `${min} min` : null].filter(Boolean).join(' · ')
      : (e?.error ? 'La descarga falló; se reintentará en la próxima actualización.' : '');
  }

  async function iniciar() {
    try {
      DIAS = await json('api/dias');
      if (!DIAS.demanda.length && !DIAS.pronostico.length) throw Object.assign(new Error('sin-datos'), { status: 503 });
      revisarVistaRapida();
      llenarDias(); await cargarDia();
      if (vistaRapida) pintarNota(await json('api/estado').catch(() => null));
    } catch (e) {
      if (e.status === 503) {
        // Sin datos todavía: muestra el avance de la actualización y vuelve a intentar.
        const est = await json('api/estado').catch(() => null);
        aviso('Preparando datos', 'Primera carga: se descarga una muestra del Coordinador Eléctrico Nacional (unos 10 minutos). La página se actualiza sola.');
        window.NodosAmpliar?.espera($('aviso-extra'), est);
        setTimeout(iniciar, est?.en_curso ? 5000 : 15000);
      } else aviso('No pude cargar los datos', e.message);
    }
  }

  paleta();
  leyenda();
  map.on('load', () => irA('todo', false));
  iniciar();

  // Cuando el servidor publica datos nuevos (p. ej. tras pedir más historia), se recargan los días
  // conservando el día y la hora elegidos.
  async function recargar() {
    const dia = $('dia').value;
    try {
      DIAS = await json('api/dias');
      const antes = modo;
      revisarVistaRapida();
      llenarDias();
      if (modo === antes && [...$('dia').options].some(o => o.value === dia)) $('dia').value = dia;
      await cargarDia();
    } catch (e) { /* se reintenta en la próxima publicación */ }
  }
  window.NodosAmpliar?.montar($('mas-datos'), { alActualizar: recargar, alEstado: pintarNota });
})();
</script>

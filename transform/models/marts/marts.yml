version: 2

models:
  - name: dim_barra
    description: Una fila por código de barra del SIP, con su subestación y coordenadas.
    columns:
      - name: barra
        description: Código SIP (14 caracteres de nombre + 3 de tensión), p. ej. LASARANAS_____110.
        data_tests: [not_null, unique]
      - name: id_subestacion
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_subestacion')
                field: id_subestacion
      - name: coord_estado
        data_tests:
          - accepted_values:
              arguments:
                values: ['ok', 'corregido', 'grados', 'manual', 'sin_coordenadas', 'fuera_de_chile', 'sin_cruce']

  - name: dim_subestacion
    description: Subestaciones de Infotécnica con coordenadas cuando están disponibles.
    columns:
      - name: id_subestacion
        data_tests: [not_null, unique]

  - name: fct_demanda_horaria
    description: Demanda por barra y hora (MWh). Grano barra × hora.
    data_tests:
      - unico_combinado:
          arguments:
            columnas: [barra, fecha_hora]
    columns:
      - name: barra
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_barra')
                field: barra
      - name: fecha_hora
        data_tests: [not_null]
      - name: demanda_mwh
        data_tests: [not_null]

  - name: fct_cmg_horario
    description: Costo marginal por barra y hora (promedio de 4 intervalos de 15 min). Grano barra × hora.
    data_tests:
      - unico_combinado:
          arguments:
            columnas: [barra, fecha_hora]
    columns:
      - name: barra
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_barra')
                field: barra
      - name: cmg_usd_mwh
        data_tests: [not_null]

  - name: fct_pronostico_horario
    description: Pronóstico del CEN por barra y hora.
    data_tests:
      - unico_combinado:
          arguments:
            columnas: [barra_pronostico, fecha_hora]

  - name: fct_sistema_horario
    description: Totales del sistema por hora.
    columns:
      - name: fecha_hora
        data_tests: [not_null, unique]
      - name: demanda_mwh
        description: Demanda total (todas las barras, ubicadas o no).
        data_tests:
          - entre:
              arguments: {minimo: 1}

  - name: mart_subestacion_horaria
    description: Subestación ubicada × hora, con demanda y costo marginal. Alimenta el mapa.
    data_tests:
      - unico_combinado:
          arguments:
            columnas: [id_subestacion, fecha_hora]
    columns:
      - name: lat
        data_tests: [not_null]
      - name: lon
        data_tests: [not_null]

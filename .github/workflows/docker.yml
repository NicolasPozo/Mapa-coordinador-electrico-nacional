name: Docker

# Construye la imagen en cada push y PR (valida el Dockerfile y que dbt compile).
# En main además la publica en GitHub Container Registry: ghcr.io/<usuario>/<repo>:latest
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen en minúsculas
        id: nombre
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Construir
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nodos-sen:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comprobar que dbt y la app cargan dentro de la imagen
        run: |
          docker run --rm nodos-sen:ci python -c "import nodos.web, nodos.actualizar; print('app OK')"
          docker run --rm -e NODOS_RAIZ=/app nodos-sen:ci sh -c "cd /app/transform && dbt parse --project-dir . --profiles-dir . && echo 'dbt OK'"

      - name: Iniciar sesión en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.nombre.outputs.imagen }}:latest,${{ steps.nombre.outputs.imagen }}:${{ github.sha }}
          cache-from: type=gha

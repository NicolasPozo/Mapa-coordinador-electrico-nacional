services:
  nodos:
    build: .
    image: nodos-sen:latest
    container_name: nodos
    ports:
      - "8000:8000"
    # CEN_SIP_USER_KEY va en .env (copia .env.example). Nunca la subas a GitHub.
    env_file: .env
    environment:
      NODOS_ACTUALIZAR_CADA_HORAS: "6"
      # Arranca con una muestra (1 día de demanda real). Más historia: botón «Más datos»
      # en el mapa, o sube estos valores (p. ej. NODOS_DIAS_DEMANDA: "7").
      NODOS_DIAS_DEMANDA: "1"
      NODOS_DIAS_CMG: "1"
      # Pon "0" si el mapa queda público y no quieres que cualquiera dispare descargas.
      NODOS_PERMITIR_AMPLIAR: "1"
    volumes:
      - nodos-data:/app/data
    restart: unless-stopped

volumes:
  nodos-data:
